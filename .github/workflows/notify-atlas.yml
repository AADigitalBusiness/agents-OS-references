name: Notify Atlas of public content changes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Atlas content update
        env:
          ATLAS_DISPATCH_TOKEN: ${{ secrets.ATLAS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$ATLAS_DISPATCH_TOKEN" ]; then
            echo "::error::Configure ATLAS_DISPATCH_TOKEN with access to aavendano/atlas-os."
            exit 1
          fi
          curl --fail-with-body --show-error --silent --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ATLAS_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/aavendano/atlas-os/dispatches \
            -d '{"event_type":"public-content-updated"}'
